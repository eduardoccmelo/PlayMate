# Production overrides. Requires POSTGRES_PASSWORD in .env; everything else
# has a sensible default. See docs/deploy-aws.md.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      PLAYUP_DATABASE_URL: postgresql+psycopg://playup:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/playup
      PLAYUP_ENVIRONMENT: ${PLAYUP_ENVIRONMENT:-production}
    logging: *logging

  frontend:
    logging: *logging

  # The only container reachable from outside. With SITE_ADDRESS set to a
  # domain it obtains and renews Let's Encrypt certificates on its own.
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
