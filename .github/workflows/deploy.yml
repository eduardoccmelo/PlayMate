name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the same box at once.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  APP_DIR: /opt/playup
  VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'browser' }}
  VITE_DEMO_SEED: ${{ vars.VITE_DEMO_SEED || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Repository variable, e.g. "example.com, www.example.com".
          # Empty until DNS points at the instance: plain HTTP on port 80.
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || ':80' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          # Variables are expanded here on the runner; the quoted 'ENV'
          # heredoc means the instance writes the password verbatim.
          script=$(cat <<EOF
          set -eu
          [ -d $APP_DIR/.git ] || git clone --quiet $REPO_URL $APP_DIR
          cd $APP_DIR
          git fetch --quiet origin
          git checkout --force --quiet $SHA
          umask 077
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          PLAYUP_ENVIRONMENT=production
          SITE_ADDRESS=$SITE_ADDRESS
          VITE_DATA_SOURCE=$VITE_DATA_SOURCE
          VITE_DEMO_SEED=$VITE_DEMO_SEED
          PLAYUP_SMTP_HOST=$SMTP_HOST
          PLAYUP_SMTP_PORT=${SMTP_PORT:-587}
          PLAYUP_SMTP_USERNAME=$SMTP_USERNAME
          PLAYUP_SMTP_PASSWORD=$SMTP_PASSWORD
          PLAYUP_SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
          ENV
          chmod 600 .env
          SITE_ADDRESS=\$(sed -n 's/^SITE_ADDRESS=//p' .env)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
          docker image prune -f
          # Through nginx, inside the network: independent of whether Caddy
          # is serving plain HTTP or redirecting to the domain over HTTPS.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T frontend wget -qO- http://127.0.0.1/api/health
          check_caddy() {
            url=\$1
            shift
            attempt=0
            while [ "\$attempt" -lt 12 ]; do
              if curl --fail --silent --show-error --max-time 5 "\$@" "\$url" </dev/null; then
                return 0
              fi
              attempt=\$((attempt + 1))
              [ "\$attempt" -ge 12 ] || sleep 5
            done
            echo "Caddy health check failed: \$url" >&2
            return 1
          }
          if [ "\$SITE_ADDRESS" = ":80" ]; then
            check_caddy http://127.0.0.1/api/health
          else
            printf '%s\n' "\$SITE_ADDRESS" | tr ',' '\n' | while IFS= read -r domain; do
              domain=\$(printf '%s' "\$domain" | tr -d ' ')
              [ -n "\$domain" ] || continue
              check_caddy "https://\$domain/api/health" --resolve "\$domain:443:127.0.0.1"
            done
          fi
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps caddy
          EOF
          )

          params=$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["1800"]}')

          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          # `aws ssm wait command-executed` gives up after ~100s; builds take longer.
          deadline=$((SECONDS + 2100))
          while :; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for SSM command $cmd_id" >&2
              exit 1
            fi
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = Success ]
